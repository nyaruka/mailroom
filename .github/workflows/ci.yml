name: CI
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-trixie

    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        env:
          # tests claim their own databases from 16-31 so need more than the default 16
          VALKEY_EXTRA_FLAGS: --databases 32
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: temba
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      elastic:
        image: elasticsearch:9.3.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        options: --health-cmd "curl http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 5
      localstack:
        image: localstack/localstack:4.14
        env:
          SERVICES: s3,dynamodb,cloudwatch
        ports:
          - 4566:4566

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
          echo "gocache=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "goversion=$(go env GOVERSION)" >> $GITHUB_OUTPUT

      - name: Install Postgres client and zstd
        # zstd must be installed before the cache step so actions/cache uses fast multithreaded
        # zstd compression instead of falling back to single-threaded gzip
        run: |
          . /etc/os-release
          echo "deb http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          wget --quiet -O /etc/apt/trusted.gpg.d/postgresql.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-15 zstd

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gomodcache }}
            ${{ steps.go-cache-paths.outputs.gocache }}
          key: go-${{ steps.go-cache-paths.outputs.goversion }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ steps.go-cache-paths.outputs.goversion }}-
            go-

      - name: Initialize database
        # we create our test database with a different user so that we can drop everything owned by this user between tests
        run: |
          export PGPASSWORD=temba
          psql -h postgres -U postgres --no-password -c "CREATE USER mailroom_test PASSWORD 'temba';"
          psql -h postgres -U postgres --no-password -c "ALTER ROLE mailroom_test WITH SUPERUSER;"
          psql -h postgres -U postgres --no-password -c "CREATE DATABASE mailroom_test;"

      - name: Run tests
        run: |
          go test -cover ./...

  release:
    name: Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-trixie

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory /__w/mailroom/mailroom

      - name: Fetch GoFlow docs
        # for backward compatibility, English docs are copied to root of docs directory
        run: |
          GOFLOW_VERSION=$(grep goflow go.mod | cut -d" " -f2 | cut -c2-)
          curl -L https://github.com/nyaruka/goflow/releases/download/v${GOFLOW_VERSION}/docs.tar.gz | tar zxv
          cp ./docs/en-us/*.* docs/

      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        if: ${{ !contains(github.ref, '-') }}
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish non-master release
        uses: goreleaser/goreleaser-action@v7
        if: contains(github.ref, '-')
        with:
          args: release --clean --skip-validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
